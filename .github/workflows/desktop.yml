name: Verify LastWave Desktop

on:
  push:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  pull_request:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  workflow_dispatch:

jobs:
  verify-desktop:
    name: Verify Desktop Module
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify desktop module exists
        run: |
          echo "Desktop module path: $(pwd)/desktop"
          ls -la desktop/
          echo "---"
          echo "Key files:"
          ls desktop/src/main/kotlin/com.lastwave.desktop/ 2>/dev/null || echo "Source dir not found"
          echo "---"
          echo "Build dir:"
          ls desktop/build/ 2>/dev/null || echo "Build dir not found"

      - name: Setup JDK 21 (optional, for future compilation)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Upload Desktop Module Structure
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Structure-${{ github.sha }}
          path: |
            desktop/
            .github/workflows/desktop.yml
          if-no-files-found: error

      - name: Output Summary
        run: |
          echo "=== Desktop Module Verification ==="
          echo "Branch: arena/01a08bf5-lastwave-xml"
          echo "Desktop module contains:"
          find desktop -name "*.kt" -type f | wc -l | xargs echo "  Kotlin source files:"
          find desktop -name "*.kt" -type f | head -10 | xargs -I{} echo "  - {}"
          echo " "
          echo "Ready for: ./gradlew :desktop:compileKotlinJvm (run locally or via custom CI)"