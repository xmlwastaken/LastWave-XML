name: Build LastWave Desktop JVM

on:
  push:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  pull_request:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  workflow_dispatch:

jobs:
  build-jvm:
    name: Compile Desktop to JVM Classes
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Compile Desktop Module (Kotlin JVM)
        env:
          LOSSLESS_BACKEND_URL: ${{ secrets.LOSSLESS_BACKEND_URL }}
          LOSSLESS_API_KEY: ${{ secrets.LOSSLESS_API_KEY }}
          LYRICS_API_KEY: ${{ secrets.LYRICS_API_KEY }}
        run: |
          ./gradlew :desktop:compileKotlin --stacktrace -Dorg.gradle.jvmargs=-Xmx2g

      - name: Verify Compilation
        run: |
          if [ -d "desktop/build/classes/jvm/main/com/lastwave/desktop" ]; then
            echo "✅ JVM compilation successful"
            echo "Compiled classes found:"
            find desktop/build/classes/jvm/main/com/lastwave/desktop -name "*.class" | wc -l | xargs echo "  .class files:"
            find desktop/build/classes/jvm/main/com/lastwave/desktop -name "*.class" | head -10 | sed 's|desktop/build/classes/jvm/main/|  |' | xargs -I{} echo "    {}"
          else
            echo "❌ JVM compilation failed — class directory not found"
            exit 1
          fi

      - name: Upload JVM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-JVM-${{ github.sha }}
          path: |
            desktop/build/classes/jvm/main/com/lastwave/desktop/
            desktop/build/resources/main/
          if-no-files-found: error

      - name: Output Summary
        run: |
          echo "=== LastWave Desktop JVM Build ==="
          echo "Branch: arena/01a08bf5-lastwave-xml"
          echo "Compiled Kotlin classes for JVM"
          echo "Artifact contains: compiled .class files + resources"
          echo "To run: java -cp desktop/build/classes/jvm/main com.lastwave.desktop.DesktopEntryPoint"
          echo "Or open in IntelliJ IDEA with Compose for Desktop plugin"