name: LastWave Desktop Module

on:
  push:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  pull_request:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Module Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (for potential compilation)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verify desktop module structure
        run: |
          echo "=== Desktop Module Structure ==="
          echo "Root: $(pwd)/desktop"
          echo ""
          echo "Kotlin source files:"
          find desktop/src -name "*.kt" -type f | sort | wc -l | xargs -I{} echo "  Total: {}"
          echo ""
          echo "Key source files:"
          find desktop/src -name "*.kt" -type f | head -15 | while read f; do
            echo "  - ${f#desktop/src/}"
          done
          echo ""
          echo "Build configuration:"
          echo "  - build.gradle.kts"
          echo "  - settings.gradle.kts (includes :desktop)"
          echo ""
          echo "CI workflow:"
          echo "  - .github/workflows/desktop.yml"
          echo ""
          echo "Dependencies (build.gradle.kts):"
          echo "  - androidx.compose.desktop:compose-desktop-jvm:1.6.0"
          echo "  - androidx.compose.material3:material3"
          echo "  - com.google.accompanist:accompanist-material3:0.43.0"
          echo "  - dagger.hilt.android: hilt-android:2.48"
          echo ""
          echo "=== Artifact will contain above structure ==="

      - name: Upload Desktop Module Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-Structure-${{ github.sha }}
          path: |
            desktop/
            .github/workflows/desktop.yml
            desktop/build.gradle.kts
            settings.gradle.kts
            README.md
          if-no-files-found: error

      - name: Output Build Instructions
        run: |
          echo "=== To Build Locally ==="
          echo "1. Clone: git clone https://github.com/xmlwastaken/LastWave-XML.git"
          echo "2. Open in IntelliJ IDEA with Compose for Desktop plugin"
          echo "3. Run: ./gradlew :desktop:run"
          echo "   (requires JDK 21 on your machine)"
          echo ""
          echo "=== To Compile on GitHub ==="
          echo "The Linux runners have limited native library support."
          echo "Kotlin source compilation may work for non-Compose files."
          echo "For full Compose Desktop, local build with JDK 21 + IDE is recommended."
          echo ""
          echo "=== To Get .exe ==="
          echo "Use Java jpackage on your machine:"
          echo "  ./gradlew jpackageJsdk --destination ./dist"
          echo "This creates platform-specific installers (.exe for Windows, .dmg for macOS)"