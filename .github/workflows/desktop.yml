name: Build LastWave Desktop

on:
  push:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  pull_request:
    branches: [ arena/01a08bf5-lastwave-xml, main, master ]
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Desktop Module
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Gradle execute permission
        run: chmod +x gradlew

      - name: Build Desktop Module
        env:
          LOSSLESS_BACKEND_URL: ${{ secrets.LOSSLESS_BACKEND_URL }}
          LOSSLESS_API_KEY: ${{ secrets.LOSSLESS_API_KEY }}
          LYRICS_API_KEY: ${{ secrets.LYRICS_API_KEY }}
        run: |
          ./gradlew :desktop:compileKotlin --stacktrace -Dorg.gradle.jvmargs=-Xmx2g

      - name: Verify Desktop Compilation
        run: |
          if [ -d "desktop/build/classes/jvm/main/com/lastwave/desktop" ]; then
            echo "✅ Desktop module compiled successfully"
          else
            echo "❌ Desktop module compilation failed"
            exit 1
          fi

      - name: Upload Desktop Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Desktop-${{ github.sha }}
          path: desktop/build/classes/jvm/main/com/lastwave/desktop/
          if-no-files-found: error